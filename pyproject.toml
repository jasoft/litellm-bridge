[project]
name = "litellm-bridge"
version = "0.1.0"
description = "OpenAI-compatible bridge for ElevenLabs transcription and speech APIs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm[proxy]==1.104.0",
    "openai>=2.28.0",
    "doubaoime-asr",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pyright>=1.1.408",
    "ruff>=0.15.6",
]

[tool.uv.sources]
doubaoime-asr = { git = "https://github.com/RayMorTwinkle/doubao-asr-free.git", rev = "7a99097e8e4ed4a58c57f975346689d724fde6a3" }
